name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Reject development tests in skill payloads
        run: |
          test_files="$(find skills -type f \( -name '*.test.*' -o -name '*.spec.*' -o -path '*/__tests__/*' \) -print)"
          if [ -n "$test_files" ]; then
            echo "Development tests must live under tests/, not skills/."
            printf '%s\n' "$test_files"
            exit 1
          fi
      - run: pnpm validate
      - run: pnpm skills add . --list
      - name: Smoke-test Codex install
        run: |
          tmp="$(mktemp -d)"
          expected="$(find "$GITHUB_WORKSPACE/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          cd "$tmp"
          "$GITHUB_WORKSPACE/node_modules/.bin/skills" add "$GITHUB_WORKSPACE" --skill '*' --agent codex --yes --no-color
          actual="$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          test "$actual" = "$expected"
      - name: Smoke-test Claude Code install
        run: |
          tmp="$(mktemp -d)"
          expected="$(find "$GITHUB_WORKSPACE/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          cd "$tmp"
          "$GITHUB_WORKSPACE/node_modules/.bin/skills" add "$GITHUB_WORKSPACE" --skill '*' --agent claude-code --yes --no-color
          actual="$(find .claude/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          test "$actual" = "$expected"
